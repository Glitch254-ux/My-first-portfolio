<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Meshack<span>.</span></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#work">Work</a></li>
        </ul>
        <a href="#contact" class="nav-btn">Let's Talk</a>
    </nav>

    <header id="home" class="hero">
        <div class="hero-content">
            <span class="badge">Open for Internships 2026</span>
            <h1>Hi, I'm <span class="name">Meshack</span></h1>
            <!-- This line below is what makes the typing effect work -->
            <p class="hero-text">a passionate <span id="typing-text"></span><span class="cursor">|</span></p>
            <p class="sub-text">
                B.Sc. IT Student crafting high-end digital experiences through clean code and modern design.
            </p>
            <div class="hero-btns">
                <a href="#work" class="btn-primary">Explore My Work</a>
                <a href="#contact" class="btn-secondary">Contact Me</a>
            </div>
        </div>
        <div class="hero-image">
            <div class="image-circle">
                <span>MN</span>
            </div>
        </div>
    </header>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <h2>// 04. Contact</h2>
        <div class="contact-container">
            <div class="contact-info">
                <h3>Let's build something amazing.</h3>
                <div class="social-links">
                    <a href="#" class="social-btn">GitHub</a>
                    <a href="#" class="social-btn">LinkedIn</a>
                </div>
            </div>
            <form id="contact-form">
                <input type="text" id="name" placeholder="Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" placeholder="Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
