<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack Nyakundi | Portfolio</title>
    <style>
        /* Quick styling to make it look decent before tomorrow */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: #333;
            background-color: #f4f4f4;
        }
        .hero {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #2c3e50;
            color: white;
            padding: 20px;
        }
        .highlight { color: #3498db; }
        .hero-buttons { margin-top: 20px; }
        .btn-primary, .btn-secondary {
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 0 10px;
            display: inline-block;
        }
        .btn-primary { background: #3498db; color: white; }
        .btn-secondary { border: 2px solid white; color: white; }
        
        .contact-container {
            padding: 50px 20px;
            max-width: 600px;
            margin: auto;
        }
        form { display: flex; flex-direction: column; gap: 15px; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; padding: 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <h1>Hi, I'm <span class="highlight">Meshack Nyakundi</span></h1>
            <p>Full-Stack Developer | Problem Solver | Tech Enthusiast</p>
            <div class="hero-buttons">
                <a href="#contact" class="btn-primary">Get In Touch</a>
                <a href="https://github.com" class="btn-secondary" target="_blank">My GitHub</a>
            </div>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact" class="contact-container">
        <h2>Contact Me</h2>
        <form id="contactForm">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    alert('Message sent! Check the Render logs.');
                    e.target.reset();
                }
            } catch (err) {
                alert('Error sending message');
            }
        });
    </script>
</body>
</html>
